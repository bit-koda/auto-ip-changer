<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Shield Glow -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filter for Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Background Orbit Rings (IP Rotation Symbol) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="8 16" />

  <!-- Outer Glowing Shield -->
  <path d="M 256 95 L 375 145 C 375 270 256 365 256 395 C 256 365 137 270 137 145 Z"
        fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.35" />

  <!-- Main Shield Body -->
  <path d="M 256 100 L 370 148 C 370 268 256 360 256 390 C 256 360 142 268 142 148 Z"
        fill="url(#shieldGrad)" />

  <!-- Inner Dark Shield -->
  <path d="M 256 116 L 354 158 C 354 258 256 342 256 370 C 256 342 158 258 158 158 Z"
        fill="url(#innerShield)" />

  <!-- Orbiting Nodes (IP Network Hops) -->
  <circle cx="256" cy="66" r="8" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="446" cy="256" r="7" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="446" r="8" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="66" cy="256" r="7" fill="#10b981" filter="url(#glow)" />

  <!-- Revolving Circular Arrows (Auto IP Switch Symbol) -->
  <!-- Top Right Arc Arrow -->
  <path d="M 295 190 A 70 70 0 0 1 326 256" fill="none" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" />
  <polygon points="326,242 338,266 314,264" fill="#00f2fe" />

  <!-- Bottom Left Arc Arrow -->
  <path d="M 217 322 A 70 70 0 0 1 186 256" fill="none" stroke="url(#neonGreen)" stroke-width="7" stroke-linecap="round" />
  <polygon points="186,270 174,246 198,248" fill="#10b981" />

  <!-- Center Privacy Lock -->
  <rect x="228" y="240" width="56" height="46" rx="8" ry="8" fill="url(#shieldGrad)" />
  <path d="M 238 240 L 238 222 A 18 18 0 0 1 274 222 L 274 240" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="260" r="4.5" fill="#020617" />
  <path d="M 256 264 L 256 274" stroke="#020617" stroke-width="4" stroke-linecap="round" />
</svg>
